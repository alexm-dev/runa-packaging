name: Push to AUR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to push (e.g., v0.3.4)'
        required: true
      dry_run:
        description: 'Test everything but skip the real push'
        type: boolean
        default: true

jobs:
  publish_aur:
    runs-on: ubuntu-latest
    if: github.repository == 'alexm-dev/runa-packaging' && github.actor == 'alexm-dev' && startsWith(inputs.tag, 'v')

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.RUNA_AUR_SSH }}

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.RUNA_CI_GPG }}
          passphrase: ${{ secrets.RUNA_CI_GPG_PS }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Push
        env:
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

          git clone "ssh://aur@aur.archlinux.org/runa.git" aur_clone
          cp arch/PKGBUILD arch/.SRCINFO aur_clone/
          cd aur_clone
          git config user.name "runa CI automation"
          git config user.email "runa@amccray.com"
          git add PKGBUILD .SRCINFO

          if [ "$DRY_RUN" = "true" ]; then
            git commit -S --allow-empty -m "Update to ${TAG} via GitHub Actions"
            git show --stat --show-signature HEAD
            git push --dry-run origin master
            echo "Dry run finished, nothing was pushed."
          elif git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -S -m "Update to ${TAG} via GitHub Actions"
            git push origin master
          fi
